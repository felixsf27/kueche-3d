<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Küche 3D</title>
<style>
  :root{--bg:#f4efe7;--panel:#fffaf3;--ink:#2f2a25;--muted:#7a6f63;--accent:#b8643f;--line:#e2d8ca;--btn:#efe6d9}
  @media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--panel:#272320;--ink:#efe7dc;--muted:#a89c8e;--accent:#d9825c;--line:#3a342e;--btn:#332e29}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;left:16px;top:16px;width:290px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:0 8px 28px rgba(0,0,0,.12);box-sizing:border-box}
  .ui h1{font-size:17px;margin:0 0 2px}
  .ui p{margin:0 0 10px;color:var(--muted);font-size:13px}
  .ui h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 6px}
  .row{display:flex;flex-wrap:wrap;gap:6px}
  button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .save{width:100%;margin-top:12px;background:var(--accent);border-color:var(--accent);color:#fff}
  .toggle{position:fixed;left:16px;top:16px;display:none}
  .hidden .ui{display:none}.hidden .toggle{display:block}
  @media (max-width:600px){.ui{top:auto;bottom:16px;width:auto;right:16px;max-height:45vh}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <h1>Unsere Küche</h1>
  <p>Drehen mit Maus oder Finger, Mausrad zoomt. Die Seite, hinter der du stehst, blendet sich mit allen Schränken aus. Raum 2,63 × 3,15 m, Arbeitsplatte 92 cm.</p>
  <h2>Oben öffnen</h2>
  <div class="row">
    <button data-t="flaps">Klappen</button>
    <button data-t="corner">Eckschrank</button>
    <button data-t="spice">Gewürzschrank</button>
    <button data-t="hood">Haube ausziehen</button>
    <button data-t="led">Licht Klappen</button>
    <button data-t="hl">Licht Haube</button>
  </div>
  <h2>Unten öffnen</h2>
  <div class="row">
    <button data-t="d0">Besteck</button>
    <button data-t="d1">Schublade Mitte</button>
    <button data-t="d2">Schublade unten</button>
    <button data-t="dw">Spülmaschine</button>
    <button data-t="sink">Spülenschrank</button>
    <button data-t="pull">Auszug am Ofen</button>
    <button data-t="tray">Blechschublade</button>
    <button data-t="buffet">Buffet</button>
  </div>
  <h2>Ansicht</h2>
  <div class="row">
    <button data-v="a">Von oben</button>
    <button data-v="b">Spülseite</button>
    <button data-v="c">Herdseite</button>
    <button data-v="e">Holzschrankseite</button>
    <button data-v="d">Fensterseite</button>
  </div>
  <button class="save" id="save">Bild speichern</button>
  <div class="row" style="margin-top:8px"><button id="hide">Menü ausblenden</button></div>
</div>
<button class="toggle" id="show">Menü</button>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf1efeb);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 50);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.95;   // auch von unten unter Schränke schauen
controls.minDistance = 0.2;
controls.maxDistance = 9;

// Licht
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d0c5, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(2.2, 6, 3.2);
sun.target.position.set(1.3, 0, 1.4);
scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, {left:-2.5, right:2.5, top:2.5, bottom:-2.5, near:2, far:10});
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.PointLight(0xffffff, 2.5, 7);
fill.position.set(1.3, 2.5, 1.7);
scene.add(fill);

// Materialien
const mat = (color, o={}) => new THREE.MeshStandardMaterial({color, roughness:.6, ...o});
const M = {
  front: mat(0xc4baad, {roughness:.5}),
  body: mat(0xb8aea1),
  inner: mat(0xf4f2ee),
  top: mat(0x4a4643, {roughness:.55}),
  wall: mat(0xfbfbfa, {roughness:.95}),
  plinth: mat(0x8f877d),
  steel: mat(0xc6c8ca, {metalness:.65, roughness:.32}),
  black: mat(0x1d1d1d, {roughness:.35}),
  glass: mat(0x101010, {roughness:.08, metalness:.3}),
  grip: mat(0x5e574f),
  pine: mat(0xc98c4f, {roughness:.55}),
  pineDark: mat(0x9c6532, {roughness:.6}),
  door: mat(0x6b4a33, {roughness:.7}),
  white: mat(0xffffff, {roughness:.5}),
  pane: mat(0xbfd9e6, {roughness:.05, transparent:true, opacity:.35}),
  sill: mat(0xe6dccb, {roughness:.5}),
  pipe: mat(0x9a9a9a, {metalness:.5, roughness:.35}),
};
const edgeMat = new THREE.LineBasicMaterial({color:0x3b3631, transparent:true, opacity:.45});

// Alles wird in die gerade aktive Gruppe gebaut (CUR), damit ganze Seiten ausblendbar sind
let CUR = scene;
// Gegen Flackern: jede Box wird um einen anderen Bruchteil eines Millimeters kleiner gebaut,
// damit nie zwei Flächen exakt aufeinanderliegen
let boxN = 0;
function box(w, h, d, m, x, y, z, parent=CUR, edges=true){
  const ins = 0.0001 + ((boxN++ * 0.6180339) % 1) * 0.0012;
  const sh = v => Math.max(v - 2*Math.min(ins, v*0.1), v*0.5);
  const g = new THREE.BoxGeometry(sh(w), sh(h), sh(d));
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = mesh.receiveShadow = true;
  if (edges) mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMat));
  parent.add(mesh);
  return mesh;
}
const bx = (x0,x1,y0,y1,z0,z1,m,parent=CUR,edges=true) =>
  box(x1-x0, y1-y0, z1-z0, m, (x0+x1)/2, (y0+y1)/2, (z0+z1)/2, parent, edges);
function cyl(r, h, m, x, y, z, parent=CUR, rot){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 24), m);
  mesh.position.set(x, y, z);
  if (rot) mesh.rotation.set(...rot);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}
function sphere(r, m, x, y, z, parent=CUR){
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}
// Front mit Griffmulde oben: schwarze Metallschiene im U-Profil, oben offen zum Reingreifen.
// Profil im Schnitt (x = Tiefe, hinten 0, vorn T), über die Breite extrudiert.
const railMat = mat(0x1b1b1b, {metalness:.7, roughness:.35});
function profileMesh(pts, len, m, parent){
  const s = new THREE.Shape(); s.moveTo(...pts[0]); for (const p of pts.slice(1)) s.lineTo(...p); s.lineTo(...pts[0]);
  const g = new THREE.ExtrudeGeometry(s, {depth:len, bevelEnabled:false});
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 20), edgeMat));
  parent.add(mesh);
  return mesh;
}
function gripFront(len, h, m, parent=CUR){
  const t = 0.02, uh = 0.022, w = 0.002;      // Schiene 22 mm hoch, 2 mm Wandstärke
  const g = new THREE.Group(); parent.add(g);
  profileMesh([[0,0],[t,0],[t,h-uh],[0,h-uh]], len, m, g);
  profileMesh([[0,h-uh],[t,h-uh],[t,h],[t-w,h],[t-w,h-uh+w],[w,h-uh+w],[w,h],[0,h]], len, railMat, g);
  return g;
}
const group = (parent=CUR) => { const g = new THREE.Group(); parent.add(g); return g; };

// ---------- Raum ----------
// x entlang der Spülwand (Herd-/Türwand bei x=0, Kaminwand bei x=W)
// z von der Spülwand Richtung Fenster, y hoch. Maße in Metern nach Felix' Skizze.
const W = 2.63, L = 3.15, H = 2.75;
const CH = {x0:2.27, z1:0.62};   // ehemaliger Kamin: 36 cm breit, 62 cm tief
const gap = 0.003, T = 0.02;
const PL = 0.10, BT = 0.88, AP = 0.92;           // Sockel, Korpus oben, Arbeitsplatte oben
const Y0 = 1.50, Y1 = 2.22, D = 0.35, YM = (Y0+Y1)/2;   // Oberschränke 72 cm

function tileTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,256,256);
  grd.addColorStop(0,'#f2cf9a'); grd.addColorStop(.5,'#ecc185'); grd.addColorStop(1,'#f4d6a6');
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  for (let i=0;i<40;i++){ g.fillStyle = `rgba(214,150,70,${Math.random()*.18})`; g.beginPath(); g.ellipse(Math.random()*256,Math.random()*256,10+Math.random()*40,4+Math.random()*10,Math.random()*3,0,7); g.fill(); }
  g.strokeStyle = '#4a3b2c'; g.lineWidth = 3; g.strokeRect(0,0,256,256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.center.set(.5,.5); t.rotation = Math.PI/4;
  t.repeat.set(W/0.33, L/0.33);
  t.anisotropy = 8;
  return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), new THREE.MeshStandardMaterial({map:tileTexture(), roughness:.45}));
floor.rotation.x = -Math.PI/2; floor.position.set(W/2, 0, L/2); floor.receiveShadow = true;
scene.add(floor);

// Seiten-Gruppen: jede Seite verschwindet samt Schränken, wenn die Kamera dahinter steht
const G = {
  back: group(scene),      // Spülwand mit allem daran
  stove: group(scene),     // Herd-/Türwand mit Herd, Kühlschrank, Gewürzschrank
  chimney: group(scene),   // Kaminwand mit Holzschrank
  window: group(scene),    // Fensterwand
  shaft: group(scene),     // Kamin (Spülseite + Kaminseite)
  corner: group(scene),    // Eckschrank (Spülseite + Herdseite)
};
const wallMeshes = [];
const wall = (...a) => wallMeshes.push(bx(...a));

// ---------- Wände ----------
CUR = G.back;    wall(-0.12,W+0.12, 0,H, -0.12,0, M.wall);
CUR = G.stove;   wall(-0.12,0, 0,H, 0,L, M.wall);
CUR = G.chimney; wall(W,W+0.12, 0,H, 0,L, M.wall);
CUR = G.shaft;   wall(CH.x0,W, 0,H, 0,CH.z1, M.wall);   // zugemauerter Kamin
// Steckdose auf der 36-cm-Seite vom Kamin
box(0.08,0.08,0.012, M.white, 2.45, 1.08, CH.z1+0.006);
box(0.04,0.04,0.004, mat(0xd8d8d8), 2.45, 1.08, CH.z1+0.014, CUR, false);

// Fensterwand mit Fenster (Heizkörper weggelassen)
CUR = G.window;
const WIN = {x0:1.15, x1:2.30, y0:0.90, y1:2.45};
wall(-0.12,WIN.x0, 0,H, L,L+0.12, M.wall);
wall(WIN.x1,W+0.12, 0,H, L,L+0.12, M.wall);
wall(WIN.x0,WIN.x1, 0,WIN.y0, L,L+0.12, M.wall);
wall(WIN.x0,WIN.x1, WIN.y1,H, L,L+0.12, M.wall);
{
  const f = 0.06, zf0 = L+0.03, zf1 = L+0.09, tr = 2.02, mx = (WIN.x0+WIN.x1)/2;
  bx(WIN.x0,WIN.x1, WIN.y0,WIN.y0+f, zf0,zf1, M.white);
  bx(WIN.x0,WIN.x1, WIN.y1-f,WIN.y1, zf0,zf1, M.white);
  bx(WIN.x0,WIN.x0+f, WIN.y0,WIN.y1, zf0,zf1, M.white);
  bx(WIN.x1-f,WIN.x1, WIN.y0,WIN.y1, zf0,zf1, M.white);
  bx(WIN.x0,WIN.x1, tr,tr+f, zf0,zf1, M.white);
  bx(mx-f/2,mx+f/2, WIN.y0,WIN.y1, zf0,zf1, M.white);
  for (const yy of [1.30,1.66]) { bx(WIN.x0,mx, yy,yy+0.025, zf0+0.01,zf0+0.03, M.white); bx(mx,WIN.x1, yy,yy+0.025, zf0+0.01,zf0+0.03, M.white); }
  bx(WIN.x0+f,WIN.x1-f, WIN.y0+f,WIN.y1-f, L+0.055,L+0.06, M.pane, CUR, false);
  bx(mx+0.05,mx+0.08, 1.30,1.36, zf0-0.03,zf0, M.steel, CUR, false);
  bx(WIN.x0-0.05,WIN.x1+0.05, WIN.y0-0.03,WIN.y0, L-0.18,L+0.03, M.sill);
}

// ---------- Herd-/Türwand ----------
CUR = G.stove;
// Tür 80 cm, Klinke auf der Kühlschrankseite, davor ca. 13 cm Platz für den Lichtschalter
const DOOR = {z0:2.20, z1:3.00};
bx(0,0.03, 0,2.02, DOOR.z0,DOOR.z1, M.door);
bx(0,0.035, 2.02,2.08, DOOR.z0-0.06,DOOR.z1+0.06, M.white);
bx(0,0.035, 0,2.02, DOOR.z0-0.06,DOOR.z0, M.white);
bx(0,0.035, 0,2.02, DOOR.z1,DOOR.z1+0.06, M.white);
cyl(.025,.03, M.steel, 0.045,1.05,DOOR.z0+0.07, CUR, [0,0,Math.PI/2]);
cyl(.011,.13, M.steel, 0.07,1.05,DOOR.z0+0.13, CUR, [Math.PI/2,0,0]);
box(0.012,0.08,0.08, M.white, 0.006, 1.05, 2.075);                    // Lichtschalter
box(0.008,0.05,0.035, mat(0xeeeeee), 0.014, 1.05, 2.075, CUR, false);
for (const z of [0.12, 0.20]){                                        // zwei Steckdosen rechts in der Ecke
  box(0.012,0.08,0.08, M.white, 0.006, 1.06, z);
  box(0.004,0.04,0.04, mat(0xd8d8d8), 0.014, 1.06, z, CUR, false);
}

// Unterschrank Herdseite: Ecke 60 × 60, Backofen 60 mit Blechschublade, daneben 15 cm Auszug (früher Weinregal)
const OV = {z0:0.60, z1:1.20}, PU = {z0:1.20, z1:1.35};
bx(0,0.56, 0,PL, 0,PU.z1, M.plinth);
bx(0,0.58, PL,BT, 0,PU.z0, M.body);
bx(0,0.02, PL,BT, PU.z0,PU.z1, M.inner, CUR, false);
bx(0.555,0.58, 0.84,BT, 0.60,PU.z1, M.grip, CUR, false);
const frontX = (z0,z1,y0,y1) => bx(0.58,0.60, y0+gap,y1-gap, z0+gap,z1-gap, M.front);
// Blechschublade unter dem Ofen
const tray = group();
gripFront(OV.z1-OV.z0-2*gap, 0.14-2*gap, M.front, tray).position.set(0.58, 0.10+gap, OV.z0+gap);
bx(0.10,0.58, 0.12,0.132, OV.z0+0.03,OV.z1-0.03, M.inner, tray);
bx(0.10,0.58, 0.132,0.21, OV.z0+0.03,OV.z0+0.042, M.inner, tray);
bx(0.10,0.58, 0.132,0.21, OV.z1-0.042,OV.z1-0.03, M.inner, tray);
bx(0.10,0.112, 0.132,0.21, OV.z0+0.042,OV.z1-0.042, M.inner, tray);
for (let i=0;i<2;i++) bx(0.14,0.55, 0.135+i*0.02,0.14+i*0.02, OV.z0+0.06,OV.z1-0.06, M.black, tray);   // Bleche
bx(0.58,0.602, 0.25,0.84, OV.z0+0.005,OV.z1-0.005, M.black);
bx(0.602,0.606, 0.31,0.71, OV.z0+0.04,OV.z1-0.04, M.glass, CUR, false);
bx(0.602,0.606, 0.74,0.83, OV.z0+0.04,OV.z1-0.04, M.steel, CUR, false);
cyl(.008,.46, M.steel, 0.63,0.72,(OV.z0+OV.z1)/2, CUR, [Math.PI/2,0,0]);
// Auszug: Front + drei offene Böden (von beiden Seiten einsehbar), zieht nach vorn raus
const pull = group();
{
  const w0 = PU.z0+0.006, w1 = PU.z1-0.022;
  bx(0.58,0.60, 0.10+gap,0.84-gap, PU.z0+gap,PU.z1-gap, M.front, pull);
  bx(0.08,0.58, 0.12,0.135, w0,w1, M.inner, pull);
  for (const y of [0.38, 0.62]) bx(0.08,0.58, y,y+0.012, w0,w1, M.inner, pull);
  bx(0.06,0.08, 0.12,0.80, w0,w1, M.inner, pull);                  // hintere Stütze, Seiten offen
}
// Arbeitsplatte + Kochfeld
bx(0,0.60, BT,AP, 0,PU.z1, M.top);
const HZ = (OV.z0+OV.z1)/2;
bx(0.05,0.57, AP,AP+0.004, HZ-0.29,HZ+0.29, M.glass);
for (const [x,dz,r] of [[0.18,-0.15,.08],[0.43,-0.15,.06],[0.18,0.15,.06],[0.43,0.15,.09]]){
  const ring = new THREE.Mesh(new THREE.RingGeometry(r-.006, r, 40), new THREE.MeshBasicMaterial({color:0x777777}));
  ring.rotation.x = -Math.PI/2; ring.position.set(x, AP+0.005, HZ+dz); CUR.add(ring);
}
// Kühlschrank: normaler Standkühlschrank, 60 breit, 58 tief, niedriger als die Tür
const FR = {z0:1.36, z1:1.96, d:0.58, h:1.80};   // 60 cm breit
bx(0,FR.d, 0,FR.h, FR.z0,FR.z1, M.steel);
bx(FR.d,FR.d+0.002, 1.12,1.13, FR.z0+0.01,FR.z1-0.01, M.grip, CUR, false);
cyl(.011,.38, M.steel, FR.d+0.03,1.38,FR.z0+0.05);
cyl(.011,.38, M.steel, FR.d+0.03,0.78,FR.z0+0.05);
for (const y of [1.56,1.19,0.96,0.58]) bx(FR.d,FR.d+0.03, y,y+0.01, FR.z0+0.045,FR.z0+0.055, M.steel, CUR, false);
// Steckdose für den Kühlschrank, direkt darüber
box(0.012,0.08,0.08, M.white, 0.006, FR.h+0.15, (FR.z0+FR.z1)/2);
box(0.004,0.04,0.04, mat(0xd8d8d8), 0.014, FR.h+0.15, (FR.z0+FR.z1)/2, CUR, false);

// Gewürzschrank über dem Kochfeld, Haube unten eingebaut und hinter einer Trennwand versteckt
const SP = {z0:0.60, z1:1.35}, HY = Y0+0.12;
bx(0,0.33, Y1-T,Y1, SP.z0,SP.z1, M.body);
bx(0,0.33, HY,HY+T, SP.z0,SP.z1, M.body);
bx(0,0.33, HY+T,Y1-T, SP.z0,SP.z0+T, M.body);
bx(0,0.33, HY+T,Y1-T, SP.z1-T,SP.z1, M.body);
bx(0,0.33, Y0,HY, SP.z0,SP.z1, M.steel);
bx(0.21,0.22, HY+T,Y1-T, SP.z0+T,SP.z1-T, M.inner);             // Trennwand
bx(0.22,0.33, YM+0.05,YM+0.068, SP.z0+T,SP.z1-T, M.inner);      // Fachboden
// Tür mit Scharnier auf der Kühlschrankseite, öffnet max. 90°, damit sie nicht gegen den Kühlschrank schlägt
const spiceDoor = group(); spiceDoor.position.set(0.35, HY, SP.z1);
const spW = SP.z1-SP.z0;
box(T, Y1-HY-gap, spW-gap, M.front, -T/2, (Y1-HY)/2, -spW/2, spiceDoor);
box(0.006, 0.16, 0.012, M.grip, 0.001, (Y1-HY)/2, -spW+0.03, spiceDoor, false);   // senkrechte Griffmulde
const hood = group();
bx(0.33,0.35, Y0+0.005,HY-0.005, SP.z0+0.005,SP.z1-0.005, M.front, hood);
bx(0.06,0.35, Y0-0.006,Y0-0.001, SP.z0+0.01,SP.z1-0.01, M.steel, hood);
const hoodLampMat = new THREE.MeshBasicMaterial({color:0x8a8a8a});
for (const z of [HZ-0.15, HZ+0.15]){
  const l = new THREE.Mesh(new THREE.CircleGeometry(0.022, 24), hoodLampMat);
  l.rotation.x = Math.PI/2; l.position.set(0.24, Y0-0.0075, z); hood.add(l);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.022, 0.027, 24), M.steel);
  ring.rotation.x = Math.PI/2; ring.position.set(0.24, Y0-0.0074, z); hood.add(ring);
}
const hobLight = new THREE.SpotLight(0xfff1d6, 3, 2, Math.PI/3, .6);
hobLight.position.set(0.25, Y0-0.02, HZ); hobLight.target.position.set(0.3, AP, HZ);
CUR.add(hobLight, hobLight.target);

// ---------- Spülwand ----------
CUR = G.back;
bx(0.56,CH.x0, 0,PL, 0,0.56, M.plinth);
bx(0.60,CH.x0-0.018, PL,BT, 0,0.02, M.inner, CUR, false);
bx(0.60,CH.x0-0.018, PL,PL+0.018, 0.02,0.58, M.inner, CUR, false);
bx(0.60,1.65, BT-0.018,BT, 0.02,0.58, M.inner, CUR, false);   // über dem Spülenschrank offen, da hängt das Becken
bx(CH.x0-0.018,CH.x0, PL,BT, 0,0.58, M.body);
bx(0.58,0.60, PL,BT, 0,0.58, M.body);                       // Seitenwand zur Ecke
for (const x of [1.05,1.65]) bx(x-0.009,x+0.009, PL+0.018,BT-0.018, 0.02,0.58, M.inner);
bx(1.05,CH.x0, 0.84,BT, 0.555,0.58, M.grip, CUR, false);   // Griffleiste über Spülmaschine + Spülenschrank
// Arbeitsplatte 167 × 60 bis zum Kamin, mit Ausschnitt für die Spüle
const SX = 1.96, SK = {x0:SX-0.22, x1:SX+0.22, z0:0.03, z1:0.55};
bx(0.60,SK.x0, BT,AP, 0,0.60, M.top);
bx(SK.x1,CH.x0, BT,AP, 0,0.60, M.top);
bx(SK.x0,SK.x1, BT,AP, 0,SK.z0, M.top);
bx(SK.x0,SK.x1, BT,AP, SK.z1,0.60, M.top);

// Drei Schubladen, einzeln: oben flach für Besteck, darunter zwei große (leer).
// Griffmulde in die Oberkante der Front gefräst, kein Griff
const drawers = [];
for (const [y0,y1] of [[0.71,0.877],[0.41,0.71],[0.10,0.41]]){
  const g = group();
  const fm = gripFront((1.05-gap)-(0.60+gap), y1-y0-2*gap, M.front, g);
  fm.rotation.y = -Math.PI/2; fm.position.set(1.05-gap, y0+gap, 0.58);
  const ty0 = y0+0.02, ty1 = y1-0.03;
  bx(0.63,1.02, ty0,ty0+0.012, 0.12,0.58, M.inner, g);
  bx(0.63,0.642, ty0+0.012,ty1, 0.12,0.58, M.inner, g);
  bx(1.008,1.02, ty0+0.012,ty1, 0.12,0.58, M.inner, g);
  bx(0.642,1.008, ty0+0.012,ty1, 0.12,0.132, M.inner, g);
  drawers.push(g);
}

// Spülmaschine in der Mitte, Klappe geht nach unten auf
{
  const s = M.steel, x0 = 1.065, x1 = 1.635;
  bx(x0,x1, PL+0.02,0.83, 0.03,0.04, s, CUR, false);
  bx(x0,x0+0.01, PL+0.02,0.83, 0.03,0.57, s, CUR, false);
  bx(x1-0.01,x1, PL+0.02,0.83, 0.03,0.57, s, CUR, false);
  bx(x0,x1, PL+0.02,PL+0.03, 0.03,0.57, s, CUR, false);
  bx(x0,x1, 0.82,0.83, 0.03,0.57, s, CUR, false);
  const rm = mat(0x8a8f94, {metalness:.4});
  for (const ry of [0.20, 0.52]){
    bx(x0+0.02,x1-0.02, ry,ry+0.008, 0.06,0.55, rm);
    for (const zz of [0.06,0.545]) bx(x0+0.02,x1-0.02, ry,ry+0.06, zz,zz+0.006, rm, CUR, false);
  }
}
const dwDoor = group(); dwDoor.position.set(1.35, PL+0.003, 0.60);
box(0.60-2*gap, 0.74-2*gap, T, M.front, 0, 0.37, -T/2, dwDoor);
box(0.54, 0.66, 0.006, M.steel, 0, 0.37, -T-0.003, dwDoor, false);

// Spüle mit Hahnbank hinten: der Wasserhahn steht auf der Spüle, das Becken ist echt vertieft
const sinkMat = mat(0x1a1a1a, {roughness:.55});
const BW = {x0:SX-0.18, x1:SX+0.18, z0:0.15, z1:0.51, d:0.19};
bx(SK.x0,SK.x1, AP,AP+0.006, SK.z0,BW.z0, sinkMat);                  // Hahnbank
bx(SK.x0,SK.x1, AP,AP+0.006, BW.z1,SK.z1, sinkMat);
bx(SK.x0,BW.x0, AP,AP+0.006, BW.z0,BW.z1, sinkMat);
bx(BW.x1,SK.x1, AP,AP+0.006, BW.z0,BW.z1, sinkMat);
bx(BW.x0-0.01,BW.x1+0.01, AP-BW.d,AP-BW.d+0.01, BW.z0-0.01,BW.z1+0.01, sinkMat);   // Beckenboden
bx(BW.x0-0.01,BW.x0, AP-BW.d,AP, BW.z0,BW.z1, sinkMat);
bx(BW.x1,BW.x1+0.01, AP-BW.d,AP, BW.z0,BW.z1, sinkMat);
bx(BW.x0-0.01,BW.x1+0.01, AP-BW.d,AP, BW.z0-0.01,BW.z0, sinkMat);
bx(BW.x0-0.01,BW.x1+0.01, AP-BW.d,AP, BW.z1,BW.z1+0.01, sinkMat);
cyl(.035,.004, M.steel, SX,AP-BW.d+0.012,0.36);
// Wasserhahn: niedriger Bogen, als Rohr modelliert
{
  const hz = 0.085, y0 = AP+0.006;
  const path = new THREE.CurvePath();
  path.add(new THREE.LineCurve3(new THREE.Vector3(SX,y0+0.03,hz), new THREE.Vector3(SX,y0+0.17,hz)));
  path.add(new THREE.CubicBezierCurve3(new THREE.Vector3(SX,y0+0.17,hz), new THREE.Vector3(SX,y0+0.29,hz), new THREE.Vector3(SX,y0+0.29,hz+0.17), new THREE.Vector3(SX,y0+0.17,hz+0.17)));
  path.add(new THREE.LineCurve3(new THREE.Vector3(SX,y0+0.17,hz+0.17), new THREE.Vector3(SX,y0+0.13,hz+0.17)));
  const tube = new THREE.Mesh(new THREE.TubeGeometry(path, 64, 0.011, 16, false), M.black);
  tube.castShadow = true; CUR.add(tube);
  cyl(.026,.03, M.black, SX,y0+0.015,hz);
  cyl(.013,.015, M.black, SX,y0+0.125,hz+0.17);                     // Strahlregler
  cyl(.015,.04, M.black, SX+0.03,y0+0.07,hz, CUR, [0,0,Math.PI/2]);  // Hebel seitlich
  bx(SX+0.045,SX+0.055, y0+0.07,y0+0.14, hz-0.006,hz+0.006, M.black, CUR, false);
}
// Siphon unter dem Becken
cyl(.022,.08, M.pipe, SX, AP-BW.d-0.04, 0.36);
{
  const trap = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.02, 10, 24, Math.PI), M.pipe);
  trap.rotation.set(0, Math.PI/2, Math.PI); trap.position.set(SX, AP-BW.d-0.08, 0.31); CUR.add(trap);
}
cyl(.02,.06, M.pipe, SX, AP-BW.d-0.05, 0.26);
cyl(.02,.24, M.pipe, SX, AP-BW.d-0.02, 0.14, CUR, [Math.PI/2,0,0]);
// Spülenschrank-Tür: Scharnier links (Spülmaschinenseite), sonst schlägt sie gegen den Holzschrank
const sinkDoor = group(); sinkDoor.position.set(1.65+gap, PL+gap, 0.60);
box(CH.x0-1.65-2*gap, 0.74-2*gap, T, M.front, (CH.x0-1.65)/2, 0.37, -T/2, sinkDoor);

// Zwei Hängeschränke, je EIN Schrank: obere Klappe schwenkt hoch, die untere wird mitgezogen,
// bleibt senkrecht und steht dann vorn vor dem Schrank
function carcass(x0, x1){
  bx(x0,x0+T, Y0,Y1, 0,D-T, M.front);
  bx(x1-T,x1, Y0,Y1, 0,D-T, M.front);
  bx(x0+T,x1-T, Y1-T,Y1, 0,D-T, M.front);
  bx(x0+T,x1-T, Y0,Y0+T, 0,D-T, M.front);
  bx(x0+T,x1-T, Y0+T,Y1-T, 0,0.012, M.inner, CUR, false);
  bx(x0+T,x1-T, YM-0.009,YM+0.009, 0.012,D-T-0.01, M.inner);
}
const flapRigs = [];
const ledMat = new THREE.MeshStandardMaterial({color:0xfff6e0, emissive:0xfff0d0, emissiveIntensity:1});
const ledLights = [];
for (const [x0,x1] of [[0.75,1.51],[1.51,CH.x0]]){
  carcass(x0, x1);
  const w = x1-x0-2*gap, hh = (Y1-Y0)/2 - gap;
  const upper = group(); upper.position.set((x0+x1)/2, Y1, D);
  box(w, hh, T, M.front, 0, -hh/2, -T/2, upper);
  const lower = group(upper); lower.position.set(0, -hh-gap*2, 0);
  box(w, hh, T, M.front, 0, -hh/2, -T/2, lower);
  box(0.16, 0.012, 0.006, M.grip, 0, -hh+0.012, 0.001, lower, false);
  flapRigs.push({upper, lower});
  // LED-Streifen unter dem Schrank
  const strip = bx(x0+0.04,x1-0.04, Y0-0.006,Y0, D-0.07,D-0.05, ledMat, CUR, false);
  strip.castShadow = false;
  const sl = new THREE.SpotLight(0xfff0d6, 2.2, 1.6, Math.PI/2.4, .8);
  sl.position.set((x0+x1)/2, Y0-0.01, D-0.08); sl.target.position.set((x0+x1)/2, AP, D-0.15);
  CUR.add(sl, sl.target); ledLights.push(sl);
}

// ---------- Eckschrank über Eck: zwei Türen gehen von der Mitte nach außen auf ----------
CUR = G.corner;
bx(0,0.75, Y0,Y1, 0,0.33, M.body);
bx(0,0.33, Y0,Y1, 0.33,0.60, M.body);
bx(0.35,0.73, Y0+T,Y1-T, 0.33,0.332, M.inner, CUR, false);
bx(0.33,0.332, Y0+T,Y1-T, 0.35,0.58, M.inner, CUR, false);
bx(0.35,0.73, YM-0.01,YM+0.01, 0.20,0.333, M.inner);
bx(0.20,0.333, YM-0.01,YM+0.01, 0.35,0.58, M.inner);
const cornerFront = group(); cornerFront.position.set(0.75, Y0, 0.35);
box(0.40-gap, Y1-Y0-gap, T, M.front, -0.20, (Y1-Y0)/2, -T/2, cornerFront);
sphere(.014, M.steel, -0.37, (Y1-Y0)*0.18, 0.012, cornerFront);
const cornerSide = group(); cornerSide.position.set(0.35, Y0, 0.60);
box(T, Y1-Y0-gap, 0.25-gap, M.front, -T/2, (Y1-Y0)/2, -0.125, cornerSide);
sphere(.014, M.steel, 0.012, (Y1-Y0)*0.18, -0.225, cornerSide);

// ---------- Kaminwand: Holzschrank, max. 36 cm tief, bündig mit dem Kamin ----------
CUR = G.chimney;
// Steckdose beim Tisch
box(0.012,0.08,0.08, M.white, W-0.006, 0.30, 2.02);
box(0.004,0.04,0.04, mat(0xd8d8d8), W-0.014, 0.30, 2.02, CUR, false);
// Küchenbuffet aus Holz (nach Foto): 120 breit, 36 tief, bündig mit dem Kamin.
// Unten links Schublade + zwei Türen, rechts hohe Tür. Oben links offene Nische + zwei Türen, rechts offene Fächer.
const P = {x0:CH.x0, x1:W, z0:0.76, z1:1.96};
const pzB = P.z0 + 0.80, pzM = P.z0 + 0.40, fx = P.x0;
const oak = mat(0xd9b27c, {roughness:.5});
const legH = 0.10, bTop = 0.86, uBot = bTop + 0.03, uTop = 1.95, ux = P.x0 + 0.06, pw = 0.018;
for (const [x,z] of [[fx+0.05,P.z0+0.04],[fx+0.05,P.z1-0.04],[P.x1-0.04,P.z0+0.04],[P.x1-0.04,P.z1-0.04],[fx+0.05,pzB]]) cyl(.02, legH, M.pine, x, legH/2, z);
// Unterteil
bx(fx,P.x1, legH,bTop, P.z0,P.z0+pw, M.pine);
bx(fx,P.x1, legH,bTop, P.z1-pw,P.z1, M.pine);
bx(P.x1-pw,P.x1, legH+pw,bTop, P.z0+pw,P.z1-pw, M.pineDark);
bx(fx,P.x1, legH,legH+pw, P.z0+pw,P.z1-pw, M.pine);
bx(fx,P.x1-pw, legH+pw,bTop, pzB-pw/2,pzB+pw/2, M.pine);
bx(fx,P.x1-pw, 0.69,0.69+pw, P.z0+pw,pzB-pw/2, M.pine);
bx(fx+0.03,P.x1-pw, 0.40,0.40+pw, P.z0+pw,pzB-pw/2, M.pine);
bx(fx+0.03,P.x1-pw, 0.40,0.40+pw, pzB+pw/2,P.z1-pw, M.pine);
bx(fx-0.02,P.x1, bTop,uBot, P.z0-0.01,P.z1+0.01, oak);                 // helle Platte
// Oberteil
bx(ux,P.x1, uBot,uTop, P.z0,P.z0+pw, M.pine);
bx(ux,P.x1, uBot,uTop, P.z1-pw,P.z1, M.pine);
bx(P.x1-pw,P.x1, uBot,uTop-pw, P.z0+pw,P.z1-pw, M.pineDark);
bx(ux,P.x1, uTop-pw,uTop, P.z0+pw,P.z1-pw, M.pine);
bx(ux,P.x1-pw, uBot,uTop-pw, pzB-pw/2,pzB+pw/2, M.pine);
bx(ux,P.x1-pw, 1.27,1.27+pw, P.z0+pw,pzB-pw/2, M.pine);              // über der offenen Nische
bx(ux+0.02,P.x1-pw, 1.62,1.62+pw, P.z0+pw,pzB-pw/2, M.pine);
for (const y of [1.30, 1.62]) bx(ux,P.x1-pw, y,y+pw, pzB+pw/2,P.z1-pw, oak);   // offene Fächer rechts

const buffetDoors = [];
function bdoor(hz, oz, y0, y1, xf, hy){
  const g = group(); g.position.set(xf, y0, hz);
  const dir = Math.sign(oz-hz), w = Math.abs(oz-hz)-2*gap;
  box(T, y1-y0-2*gap, w, M.pine, -T/2, (y1-y0)/2, dir*(w/2+gap), g);
  box(0.012, 0.012, 0.11, M.steel, -T-0.012, hy-y0, dir*(w*0.72), g);
  buffetDoors.push({g, dir});
}
bdoor(P.z0, pzM, legH+0.01, 0.69, fx, 0.63);
bdoor(pzB, pzM, legH+0.01, 0.69, fx, 0.63);
bdoor(P.z1, pzB, legH+0.01, bTop, fx, 0.80);
bdoor(P.z0, pzM, 1.27, uTop, ux, 1.33);
bdoor(pzB, pzM, 1.27, uTop, ux, 1.33);
const buffetDrawer = group();
bx(fx-T,fx, 0.69+gap,bTop-gap, P.z0+gap,pzB-gap, M.pine, buffetDrawer);
bx(fx,P.x1-0.04, 0.71,0.72, P.z0+0.03,pzB-0.03, M.pine, buffetDrawer);
bx(fx,P.x1-0.04, 0.72,0.83, P.z0+0.03,P.z0+0.045, M.pine, buffetDrawer);
bx(fx,P.x1-0.04, 0.72,0.83, pzB-0.045,pzB-0.03, M.pine, buffetDrawer);
box(0.012, 0.012, 0.14, M.steel, fx-T-0.012, 0.775, (P.z0+pzB)/2, buffetDrawer);
CUR = scene;

// Wände werfen keine Schatten, sonst laufen schräge Schattenkanten über die Fronten
wallMeshes.forEach(m => { m.castShadow = false; });

// ---------- Steuerung ----------
const state = {flaps:0, corner:0, spice:0, hood:0, d0:0, d1:0, d2:0, dw:0, sink:0, pull:0, tray:0, led:0, buffet:0, hl:0};
const target = {...state};
const deg = Math.PI/180;
const clamp01 = v => Math.max(0, Math.min(1, v));
function apply(){
  for (const r of flapRigs){
    r.upper.rotation.x = -state.flaps*90*deg;
    r.lower.rotation.x = state.flaps*90*deg;   // untere Klappe bleibt senkrecht
  }
  cornerFront.rotation.y = clamp01(state.corner*2)*100*deg;       // erst vorn
  cornerSide.rotation.y = -clamp01(state.corner*2-1)*100*deg;     // dann seitlich
  spiceDoor.rotation.y = -state.spice*90*deg;
  hood.position.x = state.hood*0.17;
  hobLight.intensity = state.hl*(1.5 + state.hood*3);
  hoodLampMat.color.setHex(state.hl > 0.5 ? 0xfff6d8 : 0x8a8a8a);
  drawers.forEach((g, i) => g.position.z = state['d'+i]*0.40);
  dwDoor.rotation.x = state.dw*88*deg;
  sinkDoor.rotation.y = -state.sink*90*deg;
  pull.position.x = state.pull*0.45;
  tray.position.x = state.tray*0.40;
  buffetDoors.forEach(d => d.g.rotation.y = -d.dir*state.buffet*100*deg);
  buffetDrawer.position.x = -state.buffet*0.25;
  ledLights.forEach(l => l.intensity = state.led*2.2);
  ledMat.emissiveIntensity = state.led;
}
const views = {
  a: {pos:[2.3,3.4,4.1], tgt:[0.9,0.9,0.7]},
  b: {pos:[1.3,1.65,4.4], tgt:[1.2,1.0,0.3]},
  c: {pos:[3.5,2.4,1.7], tgt:[0.2,1.15,1.0]},
  e: {pos:[-1.0,2.3,1.6], tgt:[2.4,0.9,1.2]},
  d: {pos:[1.3,3.0,-1.1], tgt:[1.4,0.9,2.7]},
};
let camTween = null;
function setView(k, instant){
  const v = views[k];
  if (instant){ camera.position.set(...v.pos); controls.target.set(...v.tgt); return; }
  camTween = {t:0, p0:camera.position.clone(), t0:controls.target.clone(), p1:new THREE.Vector3(...v.pos), t1:new THREE.Vector3(...v.tgt)};
}
function updateWalls(){
  const p = camera.position;
  const back = p.z > 0, stove = p.x > 0, chim = p.x < W, win = p.z < L;
  G.back.visible = back;
  G.stove.visible = stove;
  G.chimney.visible = chim;
  G.window.visible = win;
  G.shaft.visible = back && chim;
  G.corner.visible = back && stove;
}

const q = new URLSearchParams(location.search);
for (const k of Object.keys(state)) if (q.get(k)==='1') state[k] = target[k] = 1;
setView(q.get('view') || 'a', true);
if (q.get('cam')) { camera.position.set(...q.get('cam').split(',').map(Number)); controls.target.set(...(q.get('tgt')||'1,0.5,0.5').split(',').map(Number)); }
apply();

document.querySelectorAll('[data-t]').forEach(b => {
  b.classList.toggle('on', target[b.dataset.t]===1);
  b.onclick = () => { const k = b.dataset.t; target[k] = target[k] ? 0 : 1; b.classList.toggle('on', target[k]===1); };
});
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));
document.getElementById('save').onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'kueche_' + new Date().toISOString().slice(0,10) + '.png';
  a.click();
};
document.getElementById('hide').onclick = () => document.body.classList.add('hidden');
document.getElementById('show').onclick = () => document.body.classList.remove('hidden');

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now-last)/1000, .05); last = now;
  let moving = false;
  for (const k in state){
    const d = target[k]-state[k];
    if (Math.abs(d) > 1e-3){ state[k] += Math.sign(d)*Math.min(Math.abs(d), dt*(k==='corner' ? 0.8 : 1.2)); moving = true; }
  }
  if (moving) apply();
  if (camTween){
    camTween.t = Math.min(1, camTween.t + dt*1.4);
    const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  updateWalls();
  renderer.render(scene, camera);
  window.__ready = true;
  window.__scene = scene;
});
</script>
</body>
</html>
