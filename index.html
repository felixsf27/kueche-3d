<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Küche 3D</title>
<style>
  :root{--bg:#f4efe7;--panel:#fffaf3;--ink:#2f2a25;--muted:#7a6f63;--accent:#b8643f;--line:#e2d8ca;--btn:#efe6d9}
  @media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--panel:#272320;--ink:#efe7dc;--muted:#a89c8e;--accent:#d9825c;--line:#3a342e;--btn:#332e29}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;left:16px;top:16px;width:290px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:0 8px 28px rgba(0,0,0,.12);box-sizing:border-box}
  .ui h1{font-size:17px;margin:0 0 2px}
  .ui p{margin:0 0 10px;color:var(--muted);font-size:13px}
  .ui h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 6px}
  .row{display:flex;flex-wrap:wrap;gap:6px}
  button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .save{width:100%;margin-top:12px;background:var(--accent);border-color:var(--accent);color:#fff}
  .toggle{position:fixed;left:16px;top:16px;display:none}
  .hidden .ui{display:none}.hidden .toggle{display:block}
  .tabs{display:flex;gap:6px;margin-top:4px}
  .tabs button{flex:1;padding:8px 4px}
  /* Bereiche sind zu, bis man oben einen Reiter antippt */
  .ui section{display:none}
  .ui section.active{display:block}
  .info{margin:6px 0 0;color:var(--muted);font-size:13px}
  .slide{display:block;margin-top:10px;font-size:13px;color:var(--muted)}
  .slide input{width:100%;accent-color:var(--accent)}
  .crow{margin-top:8px;font-size:13px}
  .crow b{font-weight:600}.crow span{color:var(--muted)}
  .sw{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .swatch{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .swatch.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  .sw input[type=color]{width:26px;height:26px;padding:0;border:2px dashed var(--muted);border-radius:50%;background:none;cursor:pointer}
  .sw input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .sw input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
  /* Handy: unten eine Leiste mit vier Reitern, ein Bereich klappt darüber auf */
  @media (max-width:600px){
    .ui{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;max-height:none;overflow:visible;border-radius:16px 16px 0 0;border-bottom:none;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
    .head,#hide{display:none}
    .ui section{max-height:34vh;overflow:auto;padding-top:4px}
    .ui h2{margin:8px 0 5px}
    button{font-size:13px;padding:7px 9px}
    .save{margin-top:8px}
  }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="head">
  <h1>Unsere Küche</h1>
  <p>Drehen mit Maus oder Finger, Mausrad zoomt. Die Seite, hinter der du stehst, blendet sich mit allen Schränken aus. Raum 2,63 × 3,15 m, Arbeitsplatte 92 cm.</p>
  </div>
  <nav class="tabs">
    <button data-tab="open">Öffnen</button>
    <button data-tab="cab">Schrank</button>
    <button data-tab="col">Farben</button>
    <button data-tab="view">Ansicht</button>
  </nav>
  <section data-sec="open">
  <h2>Oben öffnen</h2>
  <div class="row">
    <button data-t="flaps">Klappen</button>
    <button data-t="corner">Eckschrank</button>
    <button data-t="spice">Gewürzschrank</button>
    <button data-t="hood">Haube ausziehen</button>
    <button data-t="led">Licht Klappen</button>
    <button data-t="hl">Licht Haube</button>
  </div>
  <h2>Unten öffnen</h2>
  <div class="row">
    <button data-t="d0">Besteck</button>
    <button data-t="d1">Schublade Mitte</button>
    <button data-t="d2">Schublade unten</button>
    <button data-t="dw">Spülmaschine</button>
    <button data-t="sink">Spülenschrank</button>
    <button data-t="pull">Auszug am Ofen</button>
    <button data-t="tray">Blechschublade</button>
  </div>
  </section>
  <section data-sec="cab">
  <h2>Schrank an der Kaminwand</h2>
  <div class="row">
    <button id="cabNext">Nächster Schrank</button>
    <button data-t="buffet">Öffnen</button>
  </div>
  <p id="cabInfo" class="info"></p>
  <label class="slide">Verschieben
    <input type="range" id="cabPos" min="62" step="1">
    <span id="cabPosOut"></span>
  </label>
  </section>
  <section data-sec="col">
  <h2>Farben</h2>
  <div id="colors"></div>
  </section>
  <section data-sec="view">
  <h2>Möbel</h2>
  <div class="row">
    <button data-t="table">Tisch + Stühle</button>
  </div>
  <h2>Ansicht</h2>
  <div class="row">
    <button data-v="a">Von oben</button>
    <button data-v="b">Spülseite</button>
    <button data-v="c">Herdseite</button>
    <button data-v="e">Holzschrankseite</button>
    <button data-v="d">Fensterseite</button>
  </div>
  <button class="save" id="save">Bild speichern</button>
  <div class="row" style="margin-top:8px"><button id="hide">Menü ausblenden</button></div>
  </section>
</div>
<button class="toggle" id="show">Menü</button>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf1efeb);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 50);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.95;   // auch von unten unter Schränke schauen
controls.minDistance = 0.2;
controls.maxDistance = 9;

// Licht
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d0c5, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(2.2, 6, 3.2);
sun.target.position.set(1.3, 0, 1.4);
scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, {left:-2.5, right:2.5, top:2.5, bottom:-2.5, near:2, far:10});
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.PointLight(0xffffff, 2.5, 7);
fill.position.set(1.3, 2.5, 1.7);
scene.add(fill);

// Materialien
const mat = (color, o={}) => new THREE.MeshStandardMaterial({color, roughness:.6, ...o});
const M = {
  front: mat(0xc4baad, {roughness:.5}),
  body: mat(0xb8aea1),
  inner: mat(0xf4f2ee),
  top: mat(0x4a4643, {roughness:.55}),
  wall: mat(0xfbfbfa, {roughness:.95}),
  plinth: mat(0x8f877d),
  steel: mat(0xc6c8ca, {metalness:.65, roughness:.32}),
  black: mat(0x1d1d1d, {roughness:.35}),
  glass: mat(0x101010, {roughness:.08, metalness:.3}),
  grip: mat(0x5e574f),
  pine: mat(0xc98c4f, {roughness:.55}),
  pineDark: mat(0x9c6532, {roughness:.6}),
  door: mat(0x6b4a33, {roughness:.7}),
  white: mat(0xffffff, {roughness:.5}),
  pane: mat(0xbfd9e6, {roughness:.05, transparent:true, opacity:.35}),
  sill: mat(0xe6dccb, {roughness:.5}),
  pipe: mat(0x9a9a9a, {metalness:.5, roughness:.35}),
  wallK: mat(0xfbfbfa, {roughness:.95}),                  // Wand hinter Herd + Spüle, Farbe wählbar
  fridge: mat(0xc6c8ca, {metalness:.65, roughness:.32}),
  frame: mat(0xf7f2e8, {roughness:.5}),                   // Fensterrahmen cremeweiß
  marble: mat(0xd8ccb0, {roughness:.35}),
};
M.dw = M.front.clone();                                   // Spülmaschinenfront, eigene Farbe möglich
const edgeMat = new THREE.LineBasicMaterial({color:0x3b3631, transparent:true, opacity:.45});

// Alles wird in die gerade aktive Gruppe gebaut (CUR), damit ganze Seiten ausblendbar sind
let CUR = scene;
// Gegen Flackern: jede Box wird um einen anderen Bruchteil eines Millimeters kleiner gebaut,
// damit nie zwei Flächen exakt aufeinanderliegen
let boxN = 0;
function box(w, h, d, m, x, y, z, parent=CUR, edges=true){
  const ins = 0.0001 + ((boxN++ * 0.6180339) % 1) * 0.0012;
  const sh = v => Math.max(v - 2*Math.min(ins, v*0.1), v*0.5);
  const g = new THREE.BoxGeometry(sh(w), sh(h), sh(d));
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = mesh.receiveShadow = true;
  if (edges) mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMat));
  parent.add(mesh);
  return mesh;
}
const bx = (x0,x1,y0,y1,z0,z1,m,parent=CUR,edges=true) =>
  box(x1-x0, y1-y0, z1-z0, m, (x0+x1)/2, (y0+y1)/2, (z0+z1)/2, parent, edges);
function cyl(r, h, m, x, y, z, parent=CUR, rot){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 24), m);
  mesh.position.set(x, y, z);
  if (rot) mesh.rotation.set(...rot);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}
function sphere(r, m, x, y, z, parent=CUR){
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}
// Front mit Griffmulde oben: schwarze Metallschiene im U-Profil, oben offen zum Reingreifen.
// Profil im Schnitt (x = Tiefe, hinten 0, vorn T), über die Breite extrudiert.
const railMat = mat(0x1b1b1b, {metalness:.7, roughness:.35});
function profileMesh(pts, len, m, parent){
  const s = new THREE.Shape(); s.moveTo(...pts[0]); for (const p of pts.slice(1)) s.lineTo(...p); s.lineTo(...pts[0]);
  const g = new THREE.ExtrudeGeometry(s, {depth:len, bevelEnabled:false});
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 20), edgeMat));
  parent.add(mesh);
  return mesh;
}
function gripFront(len, h, m, parent=CUR){
  const t = 0.02, uh = 0.022, w = 0.002;      // Schiene 22 mm hoch, 2 mm Wandstärke
  const g = new THREE.Group(); parent.add(g);
  profileMesh([[0,0],[t,0],[t,h-uh],[0,h-uh]], len, m, g);
  profileMesh([[0,h-uh],[t,h-uh],[t,h],[t-w,h],[t-w,h-uh+w],[w,h-uh+w],[w,h],[0,h]], len, railMat, g);
  return g;
}
const group = (parent=CUR) => { const g = new THREE.Group(); parent.add(g); return g; };

// ---------- Raum ----------
// x entlang der Spülwand (Herd-/Türwand bei x=0, Kaminwand bei x=W)
// z von der Spülwand Richtung Fenster, y hoch. Maße in Metern nach Felix' Skizze.
const W = 2.63, L = 3.15, H = 2.75;
const CH = {x0:2.27, z1:0.62};   // ehemaliger Kamin: 36 cm breit, 62 cm tief
const gap = 0.003, T = 0.02;
const PL = 0.10, BT = 0.88, AP = 0.92;           // Sockel, Korpus oben, Arbeitsplatte oben
const Y0 = 1.50, Y1 = 2.22, D = 0.35, YM = (Y0+Y1)/2;   // Oberschränke 72 cm

function tileTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,256,256);
  grd.addColorStop(0,'#f2cf9a'); grd.addColorStop(.5,'#ecc185'); grd.addColorStop(1,'#f4d6a6');
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  for (let i=0;i<40;i++){ g.fillStyle = `rgba(214,150,70,${Math.random()*.18})`; g.beginPath(); g.ellipse(Math.random()*256,Math.random()*256,10+Math.random()*40,4+Math.random()*10,Math.random()*3,0,7); g.fill(); }
  g.strokeStyle = '#4a3b2c'; g.lineWidth = 3; g.strokeRect(0,0,256,256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.center.set(.5,.5); t.rotation = Math.PI/4;
  t.repeat.set(W/0.33, L/0.33);
  t.anisotropy = 8;
  return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), new THREE.MeshStandardMaterial({map:tileTexture(), roughness:.45}));
floor.rotation.x = -Math.PI/2; floor.position.set(W/2, 0, L/2); floor.receiveShadow = true;
scene.add(floor);

// Seiten-Gruppen: jede Seite verschwindet samt Schränken, wenn die Kamera dahinter steht
const G = {
  back: group(scene),      // Spülwand mit allem daran
  stove: group(scene),     // Herd-/Türwand mit Herd, Kühlschrank, Gewürzschrank
  chimney: group(scene),   // Kaminwand mit Holzschrank
  window: group(scene),    // Fensterwand
  shaft: group(scene),     // Kamin (Spülseite + Kaminseite)
  corner: group(scene),    // Eckschrank (Spülseite + Herdseite)
};
const wallMeshes = [];
const wall = (...a) => wallMeshes.push(bx(...a));

// ---------- Wände ----------
CUR = G.back;    wall(-0.12,W+0.12, 0,H, -0.12,0, M.wallK);
CUR = G.stove;   wall(-0.12,0, 0,H, 0,L, M.wallK);
CUR = G.chimney; wall(W,W+0.12, 0,H, 0,L, M.wall);
CUR = G.shaft;   wall(CH.x0,W, 0,H, 0,CH.z1, M.wall);   // zugemauerter Kamin
// Steckdose auf der 36-cm-Seite vom Kamin
box(0.08,0.08,0.012, M.white, 2.45, 1.08, CH.z1+0.006);
box(0.04,0.04,0.004, mat(0xd8d8d8), 2.45, 1.08, CH.z1+0.014, CUR, false);

// Fensterwand: Fenster sitzt tief in einer Nische (nach Felix' Foto), Fensterbank aus hellem Marmor
CUR = G.window;
const WIN = {x0:1.15, x1:2.30, y0:0.90, y1:2.45};
const WT = 0.40, WD = 0.25;   // shortcut: Wanddicke + Nischentiefe nach Foto geschätzt, nachmessen
wall(-0.12,WIN.x0, 0,H, L,L+WT, M.wall);
wall(WIN.x1,W+0.12, 0,H, L,L+WT, M.wall);
wall(WIN.x0,WIN.x1, 0,WIN.y0, L,L+WT, M.wall);
wall(WIN.x0,WIN.x1, WIN.y1,H, L,L+WT, M.wall);
{
  // Blick zum Fenster: links (Kaminseite) der schmale Flügel, rechts der breite mit Griff
  const fm = M.frame, f = 0.06, s = 0.05, zf0 = L+WD, zf1 = zf0+0.07, zs0 = zf0-0.015, zs1 = zf0+0.04;
  const tr = 2.02, xs = WIN.x1 - 0.40*(WIN.x1-WIN.x0);
  bx(WIN.x0,WIN.x1, WIN.y0,WIN.y0+f, zf0,zf1, fm);                 // Blendrahmen
  bx(WIN.x0,WIN.x1, WIN.y1-f,WIN.y1, zf0,zf1, fm);
  bx(WIN.x0,WIN.x0+f, WIN.y0,WIN.y1, zf0,zf1, fm);
  bx(WIN.x1-f,WIN.x1, WIN.y0,WIN.y1, zf0,zf1, fm);
  bx(WIN.x0+f,WIN.x1-f, tr,tr+0.07, zf0,zf1, fm);                  // Kämpfer zwischen Oberlicht und Flügeln
  // Flügel: Rahmen + Scheibe, unten mit zwei Sprossen
  function sash(x0, x1, y0, y1, bars){
    bx(x0,x1, y0,y0+s, zs0,zs1, fm); bx(x0,x1, y1-s,y1, zs0,zs1, fm);
    bx(x0,x0+s, y0+s,y1-s, zs0,zs1, fm); bx(x1-s,x1, y0+s,y1-s, zs0,zs1, fm);
    bx(x0+s,x1-s, y0+s,y1-s, zf0+0.02,zf0+0.025, M.pane, CUR, false);
    for (let i=1;i<=bars;i++){ const y = y0+s+(y1-y0-2*s)*i/(bars+1); bx(x0+s,x1-s, y-0.0125,y+0.0125, zs0+0.005,zf0+0.015, fm); }
  }
  sash(WIN.x0+f, xs, WIN.y0+f, tr, 2);
  sash(xs, WIN.x1-f, WIN.y0+f, tr, 2);
  sash(WIN.x0+f, xs, tr+0.07, WIN.y1-f, 0);
  sash(xs, WIN.x1-f, tr+0.07, WIN.y1-f, 0);
  const hm = mat(0xb9bbbd, {metalness:.6, roughness:.35});
  bx(xs-0.035,xs-0.015, 1.40,1.47, zs0-0.02,zs0, hm, CUR, false);   // Griff am breiten Flügel
  bx(xs-0.035,xs-0.015, 1.33,1.40, zs0-0.035,zs0-0.02, hm, CUR, false);
  bx(xs-0.06,xs+0.02, WIN.y1-f-0.05,WIN.y1-f-0.03, zs0-0.02,zs0, hm, CUR, false);   // Griff Oberlicht
  bx(WIN.x0-0.05,WIN.x1+0.05, WIN.y0-0.03,WIN.y0, L-0.04,zf0+0.01, M.marble);       // Fensterbank, 4 cm Überstand
}
// Heizkörper mittig unter dem Fenster, etwas schmaler als das Fenster
{
  const hx0 = (WIN.x0+WIN.x1)/2 - 0.50, hx1 = (WIN.x0+WIN.x1)/2 + 0.50, hy0 = 0.15, hy1 = 0.72;
  const hz0 = L-0.10, hz1 = L-0.035, rad = mat(0xf7f7f5, {roughness:.4});
  bx(hx0,hx1, hy0,hy1, hz0+0.03,hz1, rad);                                  // hintere Platte
  for (let x = hx0+0.01; x < hx1-0.02; x += 0.05) bx(x,x+0.025, hy0+0.01,hy1-0.01, hz0,hz0+0.03, rad);   // Rippen
  bx(hx0,hx1, hy1-0.012,hy1, hz0,hz0+0.03, rad);                            // Abdeckung oben
  cyl(.012,.15, M.steel, hx1+0.03, hy0-0.03, hz1-0.015);                     // Anschlussrohre
  cyl(.012,.15, M.steel, hx0-0.03, hy0-0.03, hz1-0.015);
  cyl(.022,.05, M.white, hx1+0.03, hy1-0.04, hz1-0.015);                     // Thermostat
  cyl(.016,.03, M.white, hx1+0.03, hy1-0.06, hz1-0.015, CUR, [Math.PI/2,0,0]);
}

// ---------- Herd-/Türwand ----------
CUR = G.stove;
// Tür 80 cm, Klinke auf der Kühlschrankseite, davor ca. 13 cm Platz für den Lichtschalter
const DOOR = {z0:2.20, z1:3.00};
bx(0,0.03, 0,2.02, DOOR.z0,DOOR.z1, M.door);
bx(0,0.035, 2.02,2.08, DOOR.z0-0.06,DOOR.z1+0.06, M.white);
bx(0,0.035, 0,2.02, DOOR.z0-0.06,DOOR.z0, M.white);
bx(0,0.035, 0,2.02, DOOR.z1,DOOR.z1+0.06, M.white);
cyl(.025,.03, M.steel, 0.045,1.05,DOOR.z0+0.07, CUR, [0,0,Math.PI/2]);
cyl(.011,.13, M.steel, 0.07,1.05,DOOR.z0+0.13, CUR, [Math.PI/2,0,0]);
box(0.012,0.08,0.08, M.white, 0.006, 1.05, 2.075);                    // Lichtschalter
box(0.008,0.05,0.035, mat(0xeeeeee), 0.014, 1.05, 2.075, CUR, false);
for (const z of [0.12, 0.20]){                                        // zwei Steckdosen rechts in der Ecke
  box(0.012,0.08,0.08, M.white, 0.006, 1.06, z);
  box(0.004,0.04,0.04, mat(0xd8d8d8), 0.014, 1.06, z, CUR, false);
}

// Unterschrank Herdseite: Ecke 60 × 60, Backofen 60 mit Blechschublade, daneben 15 cm Auszug (früher Weinregal)
const OV = {z0:0.60, z1:1.20}, PU = {z0:1.20, z1:1.35};
bx(0,0.56, 0,PL, 0,PU.z1, M.plinth);
bx(0,0.58, PL,BT, 0,PU.z0, M.body);

// Tür mit Scharnier bei hz, geht Richtung oz auf. glass: Rahmen + Scheibe, grid: Sprossen
function hdoor(hz, oz, y0, y1, fx, m, {glass=false, grid=false, hy=null, knob=null}={}){
  const g = group(); g.position.set(fx, y0, hz);
  const dir = Math.sign(oz-hz), w = Math.abs(oz-hz)-2*gap, h = y1-y0-2*gap, zc = dir*(w/2+gap), yc = (y1-y0)/2;
  if (glass){
    const f = Math.min(0.045, w*0.15);
    box(T,h,f, m, -T/2,yc, dir*(gap+f/2), g);
    box(T,h,f, m, -T/2,yc, dir*(gap+w-f/2), g);
    box(T,f,w-2*f, m, -T/2,yc-h/2+f/2, zc, g);
    box(T,f,w-2*f, m, -T/2,yc+h/2-f/2, zc, g);
    box(0.004,h-2*f,w-2*f, M.pane, -T/2,yc, zc, g, false);
    if (grid){
      box(0.012,h-2*f,0.014, m, -T/2,yc, zc, g);
      for (const k of [-1,1]) box(0.012,0.014,w-2*f, m, -T/2,yc+k*(h-2*f)/6, zc, g);
    }
  } else box(T,h,w, m, -T/2,yc, zc, g);
  if (hy !== null){
    if (knob) sphere(.013, knob, -T-0.01, hy-y0, dir*(w-0.04), g);
    else box(0.012,0.13,0.012, M.black, -T-0.012, hy-y0, dir*(w-0.035), g);
  }
  buffetDoors.push({g, dir});
}

function bdoor(hz, oz, y0, y1, xf, hy){
  const g = group(); g.position.set(xf, y0, hz);
  const dir = Math.sign(oz-hz), w = Math.abs(oz-hz)-2*gap;
  box(T, y1-y0-2*gap, w, M.pine, -T/2, (y1-y0)/2, dir*(w/2+gap), g);
  box(0.012, 0.012, 0.11, M.steel, -T-0.012, hy-y0, dir*(w*0.72), g);
  buffetDoors.push({g, dir});
}

];
function renderColors(){
  const box = $('colors'); box.innerHTML = '';
  for (const r of colorRows){
    const row = document.createElement('div'); row.className = 'crow';
    const name = (r.presets.find(p => p[1] === r.cur) || ['eigene Farbe'])[0];
    row.innerHTML = `<b>${r.label}</b> <span>${name}</span><div class="sw"></div>`;
    const sw = row.querySelector('.sw');
    for (const p of r.presets){
      const b = document.createElement('button');
      b.className = 'swatch' + (p[1] === r.cur ? ' on' : '');
      b.style.background = hex(p[1]); b.title = p[0]; b.setAttribute('aria-label', `${r.label}: ${p[0]}`);
      b.onclick = () => { r.set(p[1], p); r.cur = p[1]; renderColors(); };
      sw.appendChild(b);
    }
    if (r.custom){
      const inp = document.createElement('input');
      inp.type = 'color'; inp.value = hex(r.cur); inp.title = 'Eigene Farbe'; inp.setAttribute('aria-label', `${r.label}: eigene Farbe`);
      inp.oninput = () => { const v = parseInt(inp.value.slice(1), 16); r.set(v); r.cur = v; row.querySelector('span').textContent = 'eigene Farbe'; };
      inp.onchange = renderColors;
      sw.appendChild(inp);
    }
    box.appendChild(row);
  }
}
showCab(cab);

// Handy: Reiter unten, ein Tipp öffnet den Bereich, noch ein Tipp klappt ihn zu
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  const open = !b.classList.contains('on');
  document.querySelectorAll('[data-tab]').forEach(o => o.classList.toggle('on', open && o === b));
  document.querySelectorAll('[data-sec]').forEach(s => s.classList.toggle('active', open && s.dataset.sec === b.dataset.tab));
});
document.getElementById('save').onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'kueche_' + new Date().toISOString().slice(0,10) + '.png';
  a.click();
};
document.getElementById('hide').onclick = () => document.body.classList.add('hidden');
document.getElementById('show').onclick = () => document.body.classList.remove('hidden');

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.fov = w < h ? 72 : 50;   // Handy hochkant: weiter Blick
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now-last)/1000, .05); last = now;
  let moving = false;
  for (const k in state){
    const d = target[k]-state[k];
    if (Math.abs(d) > 1e-3){ state[k] += Math.sign(d)*Math.min(Math.abs(d), dt*(k==='corner' ? 0.8 : 1.2)); moving = true; }
  }
  if (moving) apply();
  if (camTween){
    camTween.t = Math.min(1, camTween.t + dt*1.4);
    const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  updateWalls();
  renderer.render(scene, camera);
  window.__ready = true;
  window.__scene = scene;
});
</script>
